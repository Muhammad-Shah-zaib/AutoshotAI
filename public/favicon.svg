<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background styling using #fefcf4 from frontend design -->
    <rect id="bg" width="64" height="64" rx="16" fill="#fefcf4"/>
  </defs>
  
  <use href="#bg"/>
  
  <!-- "D" shape constructed from yarn loops, colored using primary #815a5b -->
  <g fill="none" stroke="#815a5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The straight stem of the D, slightly stylized -->
    <path d="M 22,16 C 20,32 20,32 22,48" />

    <!-- The curved loop of the D, looking soft and handcrafted -->
    <path d="M 22,20 C 36,12 50,22 42,38 C 36,50 24,46 22,44" />
    
    <!-- A small yarn-like cross-loop or stitch detail for the tactile atelier vibe -->
    <path d="M 18,32 C 24,28 32,32 30,36 C 26,40 18,36 18,32" stroke-width="2"/>
  </g>
</svg>
